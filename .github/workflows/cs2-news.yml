name: CS2 News Feed

on:
  schedule:
    # 08:00 and 20:00 CST daily
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate RSS feed
        run: python3 cs2-news/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs2-news/
          git diff --cached --quiet || (git commit -m "update cs2 news feed" && git push)

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Gino-Huang/huizhou-policy-social-computing@main/cs2-news/feed.xml" || true
